<!doctype html>
<html lang="zh-Hans">
	<head>
		<title>原理图设计 AI巧绘</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/iframe/ai-chat.css" />
	</head>
	<body>
		<div class="chat-container">
			<!-- 标题栏 -->
			<div class="chat-header">
			<h2>原理图设计 AI巧绘</h2>
			<div class="header-buttons">
					<label class="auto-exec-toggle">
						<input type="checkbox" id="autoExecWriteCheckbox" class="auto-exec-checkbox" />
						自动执行
					</label>
					<button id="configBtn" class="config-btn" title="配置 ARK API">配置</button>
					<button id="dataBtn" class="config-btn" title="数据管理（提示词 / 工具 / 资源）">数据</button>
					<button id="clearBtn" class="clear-btn" title="清空对话">清空</button>
				</div>
			</div>

			<!-- 消息显示区域 -->
			<div id="messagesContainer" class="messages-container">
				<div class="welcome-message">
					<p>🔌 你好！我是原理图设计 AI巧绘，专门帮助你进行原理图设计。</p>
					<p>我可以帮你：</p>
					<ul style="text-align: left; display: inline-block; margin-top: 8px">
						<li>解答原理图设计相关问题</li>
						<li>提供元件选型建议</li>
						<li>分析电路设计方案</li>
						<li>优化原理图布局</li>
					</ul>
					<p style="margin-top: 12px">请输入你的原理图设计问题，我会尽力帮助你！</p>
				</div>
			</div>

			<!-- 输入区域 -->
			<div class="input-container">
				<div class="input-wrapper">
					<textarea id="messageInput" class="message-input" placeholder="输入你的原理图设计问题..." rows="3"></textarea>
					<button id="stopBtn" class="stop-btn" title="停止生成" style="display: none">停止</button>
					<button id="sendBtn" class="send-btn" title="发送消息 (Enter)">发送</button>
				</div>
				<div class="status-bar">
					<span id="statusText" class="status-text"></span>
				</div>
			</div>
		</div>

		<!-- 配置对话框 -->
		<div id="configDialog" class="config-dialog" style="display: none">
			<div class="config-overlay"></div>
			<div class="config-content">
			<div class="config-header">
				<h3>ARK API 配置</h3>
				<button class="config-close-btn" id="configCloseBtn" title="关闭">×</button>
			</div>
			<div class="config-body">
				<div class="config-intro">
					<p>为了使用 AI巧绘功能，您需要配置 ARK API 的相关信息。如果您有开发者的经验,请自行前往
						<a href="https://www.volcengine.com/" target="_blank" rel="noopener noreferrer">火山引擎官网</a>
						注册并获取 API Key 和 Model 信息。<br/>
						或者您想要立马试用一下这个工具,也可以点击
						<a href="#" id="privateServerLink" target="_blank" rel="noopener noreferrer">私服登录</a>领取token后立马使用。
						 </p>
				</div>
				<div class="config-item">
					<label>
						<input type="checkbox" id="usePrivateServerCheckbox" class="config-checkbox" />
						使用私服
					</label>
				</div>
				<div class="config-item">
					<label for="arkApiKeyInput">API Key:</label>
					<input type="text" id="arkApiKeyInput" class="config-input" placeholder="请输入 API Key" />
				</div>
				<div class="config-item" id="arkModelInputContainer">
					<label for="arkModelInput">API Model:</label>
					<input type="text" id="arkModelInput" class="config-input" placeholder="请输入 API Model" />
				</div>
			</div>
				<div class="config-footer">
					<button id="configSaveBtn" class="config-save-btn">保存</button>
					<button id="configCancelBtn" class="config-cancel-btn">取消</button>
				</div>
			</div>
		</div>

		<!-- 数据管理抽屉（提示词 / 工具 / 资源 的本地数据化编辑界面，内部内容由 editor-drawer.js 动态渲染） -->
		<div id="dataDrawer" class="dm-drawer" style="display: none">
			<div class="dm-overlay" id="dmOverlay"></div>
			<div class="dm-panel">
				<!-- 抽屉头部：标题 / 数据状态徽标 / 全局操作按钮(并排,不分区) -->
				<div class="dm-header">
					<h3>数据管理</h3>
					<span id="dmStatusBadge" class="dm-status"></span>
					<div class="dm-header-actions">
						<button id="dmImportBtn" class="dm-btn" title="选择来源:从源码(内存常量) / 从本地文件 导入">导入</button>
						<input type="file" id="dmImportLocalInput" accept=".json,application/json" style="display: none" />
						<button id="dmExportBtn" class="dm-btn" title="一次导出两部分:提示词业务数据(JSON) + 函数实现源码(JS)">导出</button>
						<button id="dmDeleteBtn" class="dm-btn dm-btn-danger" title="删除本地数据库并回退到原始 JS 数据(即恢复默认),所有修改将丢失">删除数据库</button>
						<button id="dmCloseBtn" class="dm-close-btn" title="关闭">×</button>
					</div>
				</div>
				<!-- 分类标签页（由 editor-drawer.js 的 TABS 常量动态渲染：图谱 / 提示词 / 精选工具 / EDA函数 / 资源 / 日志；日志分栏未激活时隐藏） -->
				<div class="dm-tabs" id="dmTabs"></div>
				<!-- 搜索与列表工具栏 -->
				<div class="dm-toolbar">
					<input id="dmSearchInput" class="dm-search" type="text" placeholder="搜索 name / description..." />
						<button id="dmAddToolBtn" class="dm-btn" style="display: none" title="新增自定义精选工具/提示词">新增</button>
						<button id="dmClearLogBtn" class="dm-btn" style="display: none" title="清空全部会话与调用日志(仅删日志表)">清空日志</button>
					</div>
				<!-- 主体：左侧条目列表 + 右侧编辑面板 -->
				<div class="dm-body">
					<div class="dm-list-wrap">
						<ul id="dmList" class="dm-list"></ul>
						<div class="dm-pager">
							<button id="dmPrevPageBtn" class="dm-btn">上一页</button>
							<span id="dmPageInfo" class="dm-page-info"></span>
							<button id="dmNextPageBtn" class="dm-btn">下一页</button>
						</div>
					</div>
					<div class="dm-splitter" id="dmSplitter"></div>
					<div id="dmEdit" class="dm-edit">
						<div class="dm-edit-empty">请选择左侧条目进行查看 / 编辑</div>
					</div>
				</div>
			</div>
		</div>

		<script src="/iframe/.vendor/alasql.min.js"></script>
		<script src="/iframe/.vendor/d3.min.js"></script>
		<script src="/iframe/ark-api.js"></script>
		<script src="/iframe/mcp/prompts.js"></script>
		<script src="/iframe/mcp/eda-api.js"></script>
		<script src="/iframe/mcp/curated-tools/shared.js"></script>
		<script src="/iframe/mcp/curated-tools/component.js"></script>
		<script src="/iframe/mcp/curated-tools/wiring.js"></script>
		<script src="/iframe/mcp/curated-tools/selection.js"></script>
		<script src="/iframe/mcp/curated-tools/index.js"></script>
		<script src="/iframe/mcp/meta-tools.js"></script>
		<script src="/iframe/mcp/resources.js"></script>
		<script src="/iframe/error-handler.js"></script>
		<script src="/iframe/abort-signal.js"></script>
		<script src="/iframe/data-store.js"></script>
		<script src="/iframe/editor-drawer.js"></script>
		<script src="/iframe/graph-view.js"></script>
		<script src="/iframe/ai-chat.js"></script>
	</body>
</html>
